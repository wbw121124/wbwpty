[package]
name = "wbwpty-core"
description = "ConPTY-free Windows terminal core: manual-mapped DLL injection + named pipe stdio redirection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
# The host's virtual screen. Zero platform dependencies, and `std` - which is
# exactly why it cannot live in the `no_std` payload (see `src/screen.rs`).
vt-parser = { path = "../vt-parser" }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    # `inspect`'s process watcher. ETW rather than polling, because a console
    # host is short-lived and polling is what makes the claim unfalsifiable.
    # `Win32_System_Time` is not optional here: windows-sys gates
    # `EVENT_TRACE_LOGFILEW` behind it.
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Time",
] }

[dev-dependencies]
# Host-side tests disassemble the remote stub. `iced-x86` is shared with the
# DLL through `[workspace.dependencies]`; its `std` and `no_std` features are
# mutually exclusive, so both crates must use the same (no_std) flavour.
iced-x86.workspace = true
tempfile = "3"